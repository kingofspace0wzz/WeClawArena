name: Benchmark orchestration

on:
  pull_request:
    paths:
      - "benchmark/**"
      - "clawsocialarena/**"
      - "scripts/**"
      - "tests/**"
      - "docs/superpowers/plans/**"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/benchmark-orchestration.yml"
  push:
    branches:
      - main
    paths:
      - "benchmark/**"
      - "clawsocialarena/**"
      - "scripts/**"
      - "tests/**"
      - "docs/superpowers/plans/**"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/benchmark-orchestration.yml"
  workflow_dispatch:

jobs:
  benchmark-orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run benchmark readiness gates
        run: |
          python scripts/orchestrate_benchmark.py prepare --seed 1200 --version v1.0.0
