# Auto-generated docker-compose for scenario partial_log_recovery_v1.
# Do not edit by hand -- regenerate via the scenario generator CLI.
#
# One OpenClaw container per agent + one gateway container on a private
# `clawnet` bridge. The gateway exposes :8080 on the host so the runner can
# poll /healthz; agent containers reach the gateway by service name.
#
# `build.context` is an absolute path so this compose file resolves
# correctly regardless of how deep the scenario bundle lives. Persona +
# MCP files are mounted into each agent container read-only so the
# OpenClaw CLI can load them without baking them into the image.

services:
  gateway:
    image: clawsocialarena/gateway:dev
    build:
      context: /Users/princewang/llm/mas/clawsocialarena
      dockerfile: docker/gateway.Dockerfile
    environment:
      - CLAWSOCIAL_GATEWAY_PORT=8080
      - CLAWSOCIAL_SCENARIO_ID=partial_log_recovery_v1
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scenario-id
      - partial_log_recovery_v1
      - --condition
      - passive
      - --db-path
      - /workspace/run/action_log.db
      - --work-dir
      - /workspace/run
      - --gt-path
      - /workspace/scenario.gt.json

    ports:
      - "8080:8080"
    volumes:
      - ./run:/workspace/run:rw
      - ./scenario.gt.json:/workspace/scenario.gt.json:ro

    networks: [clawnet]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"
      interval: 2s
      retries: 20

  alice:
    image: clawsocialarena/openclaw-with-plugin:dev
    build:
      context: /Users/princewang/llm/mas/clawsocialarena
      dockerfile: docker/openclaw-with-plugin.Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      - CLAWSOCIAL_GATEWAY_URL=http://gateway:8080
      - CLAWSOCIAL_AGENT_ID=alice
      - CLAWSOCIAL_USER_ID=user-alice
    volumes:
      - ./personas/alice.system.md:/workspace/persona.system.md:ro
      - ./personas/alice.tools.json:/workspace/persona.tools.json:ro
      - ./mcp:/workspace/mcp:ro
    networks: [clawnet]
    # The image's ENTRYPOINT is `openclaw` so the `--version` smoke works.
    # Override both entrypoint + command here so the scenario bundle
    # launches the arena agent loop via the in-image entrypoint script.
    entrypoint: ["/usr/local/bin/agent-entrypoint.sh"]
    command: []

  bob:
    image: clawsocialarena/openclaw-with-plugin:dev
    build:
      context: /Users/princewang/llm/mas/clawsocialarena
      dockerfile: docker/openclaw-with-plugin.Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      - CLAWSOCIAL_GATEWAY_URL=http://gateway:8080
      - CLAWSOCIAL_AGENT_ID=bob
      - CLAWSOCIAL_USER_ID=user-bob
    volumes:
      - ./personas/bob.system.md:/workspace/persona.system.md:ro
      - ./personas/bob.tools.json:/workspace/persona.tools.json:ro
      - ./mcp:/workspace/mcp:ro
    networks: [clawnet]
    # The image's ENTRYPOINT is `openclaw` so the `--version` smoke works.
    # Override both entrypoint + command here so the scenario bundle
    # launches the arena agent loop via the in-image entrypoint script.
    entrypoint: ["/usr/local/bin/agent-entrypoint.sh"]
    command: []

  carol:
    image: clawsocialarena/openclaw-with-plugin:dev
    build:
      context: /Users/princewang/llm/mas/clawsocialarena
      dockerfile: docker/openclaw-with-plugin.Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      - CLAWSOCIAL_GATEWAY_URL=http://gateway:8080
      - CLAWSOCIAL_AGENT_ID=carol
      - CLAWSOCIAL_USER_ID=user-carol
    volumes:
      - ./personas/carol.system.md:/workspace/persona.system.md:ro
      - ./personas/carol.tools.json:/workspace/persona.tools.json:ro
      - ./mcp:/workspace/mcp:ro
    networks: [clawnet]
    # The image's ENTRYPOINT is `openclaw` so the `--version` smoke works.
    # Override both entrypoint + command here so the scenario bundle
    # launches the arena agent loop via the in-image entrypoint script.
    entrypoint: ["/usr/local/bin/agent-entrypoint.sh"]
    command: []

networks:
  clawnet:
    driver: bridge
    internal: false
