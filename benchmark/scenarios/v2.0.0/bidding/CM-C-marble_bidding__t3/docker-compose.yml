      - CLAWSOCIAL_USER_ID=kestrel_lab
    volumes:
      - ./personas/kestrel_buyer.system.md:/workspace/persona.system.md:ro
      - ./personas/kestrel_buyer.tools.json:/workspace/persona.tools.json:ro
      - ./mcp:/workspace/mcp:ro
    networks: [clawnet]
    # The image's ENTRYPOINT is `openclaw` so the `--version` smoke works.
