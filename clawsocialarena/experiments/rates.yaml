# Per-provider USD rates for ClawSocialArena v2 cost accounting (spec §5.2).
#
# All rates are USD per 1,000,000 tokens. The four entries below track the
# spec's model panel:
#   - Anthropic via AWS Bedrock (claude-sonnet-4-6)
#   - OpenAI (gpt-5-mini)
#   - DeepSeek (deepseek-v3)
#   - Alibaba (qwen3-72b-instruct)
#
# cached_input_usd_per_m is the rate for cached prompt tokens when the
# provider supports prompt caching. For providers that do not advertise a
# distinct cached rate we leave it equal to the input rate so caching is
# neutral rather than implicitly free.
#
# Numbers reflect public list pricing at time of spec authorship (2026-04).
# Update this file when prices move; run_grid.py reads it lazily at cost
# aggregation time so no code change is needed. Mocked / unknown models
# not listed here default to zero cost, which is correct for dry runs and
# test fixtures.

claude-sonnet-4-6:
  input_usd_per_m: 3.00
  output_usd_per_m: 15.00
  cached_input_usd_per_m: 0.30

claude-sonnet-4-7:
  input_usd_per_m: 3.00
  output_usd_per_m: 15.00
  cached_input_usd_per_m: 0.30

gpt-5-mini:
  input_usd_per_m: 0.25
  output_usd_per_m: 2.00
  cached_input_usd_per_m: 0.03

deepseek-v3:
  input_usd_per_m: 0.27
  output_usd_per_m: 1.10
  cached_input_usd_per_m: 0.07

qwen3-72b-instruct:
  input_usd_per_m: 0.40
  output_usd_per_m: 1.20
  cached_input_usd_per_m: 0.40
