[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawsocialarena"
version = "2.0.0"
description = "An auditable sandbox and benchmark for cross-user agent collaboration and security"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = [
  "pydantic>=2.12",
  "numpy>=1.26",
  "networkx>=3.2",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "openai>=2.0",
  "boto3>=1.34",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.9",
  "scipy>=1.11",
  "tabulate>=0.9",
  "jinja2>=3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["clawsocialarena*"]

[tool.setuptools.package-data]
"clawsocialarena.generator.templates" = ["*.j2"]
"clawsocialarena.experiments" = ["*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "slow: end-to-end materializations and full-pilot scaffolds that can be skipped via `-m 'not slow'`",
]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = [
  "networkx",
  "networkx.*",
  "pandas",
  "pandas.*",
  "scipy",
  "scipy.*",
  "yaml",
  "yaml.*",
]
ignore_missing_imports = true
